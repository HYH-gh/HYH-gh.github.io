<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title></title>
    <style>        
        .img img{
            position: absolute;
            opacity: 0;
            animation: a 18s infinite;
        }
        .img img {
            width: 50%;
        }
        @keyframes a {
            0% { opacity: 0;}
            5% {opacity: 1;}
            20% {opacity: 1;}
            25% {opacity: 0;}
            100% {opacity: 0;}
        }
        img:nth-child(1) { animation-delay: 0s; }
        img:nth-child(2) { animation-delay: 3s; }
        img:nth-child(3) { animation-delay: 6s; }
        img:nth-child(4) { animation-delay: 9s; }
        img:nth-child(5) { animation-delay: 12s; }
        img:nth-child(6) { animation-delay: 15s; }
    </style>
</head>
<body>
    <div class="img">
        <img src="../res/img/2.png" alt="Image 1" />
        <img src="../res/img/1.webp" alt="Image 2" />
        <img src="../res/img/3.webp" alt="Image 3" />
        <img src="../res/img/4.webp" alt="Image 4" />
        <img src="../res/img/4.webp" alt="Image 5" />
        <img src="../res/img/1.webp" alt="Image 6" />
    </div>
</body>
</html>
