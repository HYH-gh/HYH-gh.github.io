<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>导航主页</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="app-bg"></div>

    <header class="header">
        <div class="header-left">
            <svg class="logo-icon" viewBox="0 0 32 32" width="28" height="28">
                <rect x="2" y="2" width="12" height="12" rx="3" fill="var(--accent)"/>
                <rect x="18" y="2" width="12" height="12" rx="3" fill="var(--accent)" opacity="0.6"/>
                <rect x="2" y="18" width="12" height="12" rx="3" fill="var(--accent)" opacity="0.6"/>
                <rect x="18" y="18" width="12" height="12" rx="3" fill="var(--accent)" opacity="0.35"/>
            </svg>
            <span class="header-title">导航中心</span>
        </div>
        <div class="header-right">
            <span class="admin-tag" id="adminBadge">管理员</span>
            <button class="header-btn" id="themeToggle" title="切换主题" onclick="toggleTheme()">
                <svg class="icon-sun" viewBox="0 0 24 24" width="18" height="18">
                    <circle cx="12" cy="12" r="5" fill="none" stroke="currentColor" stroke-width="2"/>
                    <line x1="12" y1="1" x2="12" y2="4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                    <line x1="12" y1="20" x2="12" y2="23" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                    <line x1="20" y1="12" x2="23" y2="12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                    <line x1="1" y1="12" x2="4" y2="12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                    <line x1="4.22" y1="4.22" x2="6.34" y2="6.34" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                    <line x1="17.66" y1="17.66" x2="19.78" y2="19.78" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                    <line x1="4.22" y1="19.78" x2="6.34" y2="17.66" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                    <line x1="19.78" y1="4.22" x2="17.66" y2="6.34" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                </svg>
                <svg class="icon-moon" viewBox="0 0 24 24" width="18" height="18">
                    <path d="M21 12.79A9 9 0 1 1 11.21 3a7 7 0 0 0 9.79 9.79z" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </button>
            <button class="header-btn" id="adminBtn" onclick="toggleLogin()">管理员登录</button>
        </div>
    </header>

    <main class="main">
        <section class="hero">
            <h2 class="hero-title">快速导航</h2>
            <p class="hero-sub">选择项目开始探索</p>
        </section>
        <div class="nav-grid" id="navGrid"></div>
    </main>

    <!-- Login Modal -->
    <div class="modal-overlay" id="loginModal">
        <div class="modal">
            <div class="modal-icon">
                <svg viewBox="0 0 24 24" width="28" height="28">
                    <circle cx="12" cy="8" r="4" fill="none" stroke="var(--accent)" stroke-width="2"/>
                    <path d="M6 21v-2a4 4 0 0 1 4-4h4a4 4 0 0 1 4 4v2" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linecap="round"/>
                </svg>
            </div>
            <div class="modal-title">管理员登录</div>
            <div class="form-group">
                <label>账号</label>
                <input type="text" id="loginUser" placeholder="请输入管理员账号" autocomplete="off">
            </div>
            <div class="form-group">
                <label>密码</label>
                <input type="password" id="loginPass" placeholder="请输入密码" onkeydown="if(event.key==='Enter') doLogin()">
            </div>
            <div class="modal-actions">
                <button class="btn btn-secondary" onclick="closeModal('loginModal')">取消</button>
                <button class="btn btn-accent" onclick="doLogin()">登录</button>
            </div>
        </div>
    </div>

    <!-- Admin Panel Modal -->
    <div class="modal-overlay" id="adminModal">
        <div class="modal modal-wide">
            <div class="modal-icon">
                <svg viewBox="0 0 24 24" width="28" height="28">
                    <circle cx="12" cy="12" r="3" fill="none" stroke="var(--accent)" stroke-width="2"/>
                    <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42" stroke="var(--accent)" stroke-width="2" stroke-linecap="round"/>
                </svg>
            </div>
            <div class="modal-title">管理导航</div>
            <div class="admin-toolbar">
                <button class="btn btn-accent" onclick="openAddModal()">
                    <svg viewBox="0 0 24 24" width="16" height="16"><line x1="12" y1="5" x2="12" y2="19" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><line x1="5" y1="12" x2="19" y2="12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
                    添加
                </button>
                <button class="btn btn-secondary" onclick="exportConfig()">
                    <svg viewBox="0 0 24 24" width="16" height="16"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><line x1="7" y1="10" x2="12" y2="15" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><line x1="12" y1="15" x2="17" y2="10" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><line x1="12" y1="15" x2="12" y2="3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
                    导出
                </button>
                <button class="btn btn-secondary" onclick="triggerImport()">
                    <svg viewBox="0 0 24 24" width="16" height="16"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><line x1="17" y1="8" x2="12" y2="3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><line x1="12" y1="3" x2="7" y2="8" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><line x1="12" y1="15" x2="12" y2="3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
                    导入
                </button>
                <button class="btn btn-secondary" onclick="openLogModal()">
                    <svg viewBox="0 0 24 24" width="16" height="16"><rect x="3" y="3" width="18" height="18" rx="3" fill="none" stroke="currentColor" stroke-width="2"/><line x1="8" y1="8" x2="16" y2="8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><line x1="8" y1="12" x2="14" y2="12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><line x1="8" y1="16" x2="12" y2="16" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
                    日志
                </button>
                <button class="btn btn-accent" id="syncDiskBtn" onclick="syncDiskFiles()" title="同步磁盘文件后，所有修改将直接写入磁盘文件">
                    <svg viewBox="0 0 24 24" width="16" height="16"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><line x1="7" y1="10" x2="12" y2="15" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><line x1="12" y1="15" x2="17" y2="10" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><line x1="12" y1="15" x2="12" y2="3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
                    同步磁盘
                </button>
                <span class="sync-status" id="syncStatus"></span>
                <button class="btn btn-secondary" onclick="doLogout()">
                    <svg viewBox="0 0 24 24" width="16" height="16"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><line x1="16" y1="17" x2="21" y2="12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><line x1="21" y1="12" x2="16" y2="7" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><line x1="21" y1="12" x2="9" y2="12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
                    退出
                </button>
            </div>
            <input type="file" id="importInput" accept=".json" style="display:none" onchange="importConfig(event)">
            <div class="admin-list" id="adminList"></div>
            <div class="admin-hint">
                <svg viewBox="0 0 24 24" width="14" height="14" style="flex-shrink:0"><circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="2"/><line x1="12" y1="8" x2="12" y2="12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="12" cy="17" r="0.5" fill="currentColor"/></svg>
                <span>编辑后不会自动修改磁盘文件，请点击「导出」下载 JSON，手动替换 <code>data/nav.json</code> 后 Git 提交即可同步给所有用户。</span>
            </div>
            <div class="modal-actions">
                <button class="btn btn-secondary" onclick="closeModal('adminModal')">关闭</button>
            </div>
        </div>
    </div>

    <!-- Add / Edit Item Modal -->
    <div class="modal-overlay" id="itemModal">
        <div class="modal">
            <div class="modal-icon">
                <svg viewBox="0 0 24 24" width="28" height="28">
                    <rect x="3" y="3" width="18" height="18" rx="3" fill="none" stroke="var(--accent)" stroke-width="2"/>
                    <line x1="12" y1="8" x2="12" y2="16" stroke="var(--accent)" stroke-width="2" stroke-linecap="round"/>
                    <line x1="8" y1="12" x2="16" y2="12" stroke="var(--accent)" stroke-width="2" stroke-linecap="round"/>
                </svg>
            </div>
            <div class="modal-title" id="itemModalTitle">添加导航项</div>
            <div class="form-group">
                <label>名称</label>
                <input type="text" id="itemName" placeholder="例如：诗词浏览">
            </div>
            <div class="form-group">
                <label>路径 / URL</label>
                <input type="text" id="itemPath" placeholder="例如：poetry/index.html 或 https://example.com">
            </div>
            <div class="form-group">
                <label>导航类型</label>
                <div class="toggle-seg" id="pathTypeSeg">
                    <button class="toggle-seg-btn active" data-type="path" onclick="setPathType('path')">相对路径</button>
                    <button class="toggle-seg-btn" data-type="url" onclick="setPathType('url')">外部 URL</button>
                </div>
            </div>
            <div class="modal-actions">
                <button class="btn btn-secondary" onclick="closeModal('itemModal')">取消</button>
                <button class="btn btn-accent" id="itemSaveBtn" onclick="saveItem()">保存</button>
            </div>
            <input type="hidden" id="editIndex" value="-1">
        </div>
    </div>

    <!-- Log Management Modal -->
    <div class="modal-overlay" id="logModal">
        <div class="modal modal-log">
            <div class="modal-icon">
                <svg viewBox="0 0 24 24" width="28" height="28">
                    <rect x="3" y="3" width="18" height="18" rx="3" fill="none" stroke="var(--accent)" stroke-width="2"/>
                    <line x1="8" y1="8" x2="16" y2="8" stroke="var(--accent)" stroke-width="1.5" stroke-linecap="round"/>
                    <line x1="8" y1="12" x2="14" y2="12" stroke="var(--accent)" stroke-width="1.5" stroke-linecap="round"/>
                    <line x1="8" y1="16" x2="12" y2="16" stroke="var(--accent)" stroke-width="1.5" stroke-linecap="round"/>
                </svg>
            </div>
            <div class="modal-title">日志管理</div>
            <div class="admin-toolbar">
                <button class="btn btn-accent" onclick="openLogEdit(-1)">
                    <svg viewBox="0 0 24 24" width="16" height="16"><line x1="12" y1="5" x2="12" y2="19" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><line x1="5" y1="12" x2="19" y2="12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
                    添加日志
                </button>
                <button class="btn btn-secondary" onclick="exportLog()">
                    <svg viewBox="0 0 24 24" width="16" height="16"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><line x1="7" y1="10" x2="12" y2="15" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><line x1="12" y1="15" x2="17" y2="10" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><line x1="12" y1="15" x2="12" y2="3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
                    导出
                </button>
                <button class="btn btn-secondary" onclick="triggerLogImport()">
                    <svg viewBox="0 0 24 24" width="16" height="16"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><line x1="17" y1="8" x2="12" y2="3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><line x1="12" y1="3" x2="7" y2="8" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><line x1="12" y1="15" x2="12" y2="3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
                    导入
                </button>
            </div>
            <input type="file" id="logImportInput" accept=".json" style="display:none" onchange="importLogConfig(event)">
            <div class="admin-list" id="logList" style="max-height:360px"></div>
            <div class="admin-hint">
                <svg viewBox="0 0 24 24" width="14" height="14" style="flex-shrink:0"><circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="2"/><line x1="12" y1="8" x2="12" y2="12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="12" cy="17" r="0.5" fill="currentColor"/></svg>
                <span>日志存储在本地浏览器，点击「导出」下载 JSON 替换 <code>data/log.json</code> 后提交即可同步</span>
            </div>
            <div class="modal-actions">
                <button class="btn btn-secondary" onclick="closeModal('logModal')">关闭</button>
            </div>
        </div>
    </div>

    <!-- Log Edit Modal -->
    <div class="modal-overlay" id="logEditModal">
        <div class="modal">
            <div class="modal-icon">
                <svg viewBox="0 0 24 24" width="28" height="28">
                    <path d="M12 20h9" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linecap="round"/>
                    <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round"/>
                </svg>
            </div>
            <div class="modal-title" id="logEditTitle">添加日志</div>
            <div class="form-group">
                <label>标题</label>
                <input type="text" id="logTitle" placeholder="日志标题">
            </div>
            <div class="form-group">
                <label>内容</label>
                <textarea id="logContent" placeholder="日志内容..." rows="4" style="resize:vertical"></textarea>
            </div>
            <div class="modal-actions">
                <button class="btn btn-secondary" onclick="closeModal('logEditModal')">取消</button>
                <button class="btn btn-accent" onclick="saveLog()">保存</button>
            </div>
            <input type="hidden" id="logEditIndex" value="-1">
        </div>
    </div>

    <!-- Toast Container -->
    <div class="toast-stack" id="toastContainer"></div>

    <script src="js/main.js"></script>
</body>
</html>
