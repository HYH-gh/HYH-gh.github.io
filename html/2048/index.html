<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>2048 - 自定义棋盘</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: #faf8ef;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            user-select: none;
            -webkit-user-select: none;
        }

        .container {
            width: 100%;
            max-width: 520px;
            padding: 20px;
        }

        /* ---- Header ---- */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .title {
            font-size: 48px;
            font-weight: 900;
            color: #776e65;
            line-height: 1;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .score-box {
            background: #bbada0;
            color: #fff;
            border-radius: 6px;
            padding: 6px 16px;
            text-align: center;
            min-width: 72px;
        }

        .score-box .label {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            opacity: 0.8;
        }

        .score-box .value {
            font-size: 22px;
            font-weight: 700;
            line-height: 1.2;
        }

        .btn-new {
            background: #8f7a66;
            color: #f9f6f2;
            border: none;
            border-radius: 6px;
            padding: 10px 18px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.15s;
        }

        .btn-new:hover {
            background: #9f8b77;
        }

        .btn-new:active {
            transform: scale(0.96);
        }

        /* ---- Controls ---- */
        .controls {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 16px;
            flex-wrap: wrap;
        }

        .controls label {
            font-size: 14px;
            font-weight: 600;
            color: #776e65;
        }

        .controls input[type="range"] {
            flex: 1;
            min-width: 100px;
            accent-color: #8f7a66;
            height: 6px;
            cursor: pointer;
        }

        .controls .size-display {
            font-size: 16px;
            font-weight: 700;
            color: #776e65;
            min-width: 32px;
            text-align: center;
        }

        .controls .size-value {
            background: #bbada0;
            color: #fff;
            border-radius: 4px;
            padding: 2px 12px;
            font-size: 16px;
            font-weight: 700;
        }

        /* ---- Game Board ---- */
        .board-wrapper {
            position: relative;
            background: #bbada0;
            border-radius: 8px;
            padding: 8px;
            touch-action: none;
        }

        .board {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            aspect-ratio: 1 / 1;
            position: relative;
        }

        /* Background cells */
        .cell {
            background: rgba(238, 228, 218, 0.35);
            border-radius: 4px;
        }

        /* ---- Tile container (overlay) ---- */
        .tile-container {
            position: absolute;
            top: 8px;
            left: 8px;
            right: 8px;
            bottom: 8px;
            pointer-events: none;
        }

        .tile {
            position: absolute;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: 800;
            border-radius: 4px;
            transition: top 120ms ease, left 120ms ease;
            z-index: 1;
            will-change: transform, top, left;
        }

        .tile.new-tile {
            animation: tileAppear 0.2s ease;
        }

        .tile.merged-tile {
            animation: tilePop 0.2s ease;
            z-index: 2;
        }

        @keyframes tileAppear {
            0% {
                transform: scale(0);
                opacity: 0;
            }
            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        @keyframes tilePop {
            0% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.2);
            }
            100% {
                transform: scale(1);
            }
        }

        /* Tile colors */
        .tile-2 { background: #eee4da; color: #776e65; }
        .tile-4 { background: #ede0c8; color: #776e65; }
        .tile-8 { background: #f2b179; color: #f9f6f2; }
        .tile-16 { background: #f59563; color: #f9f6f2; }
        .tile-32 { background: #f67c5f; color: #f9f6f2; }
        .tile-64 { background: #f65e3b; color: #f9f6f2; }
        .tile-128 { background: #edcf72; color: #f9f6f2; font-size: 0.85em; }
        .tile-256 { background: #edcc61; color: #f9f6f2; font-size: 0.85em; }
        .tile-512 { background: #edc850; color: #f9f6f2; font-size: 0.85em; }
        .tile-1024 { background: #edc53f; color: #f9f6f2; font-size: 0.7em; }
        .tile-2048 { background: #edc22e; color: #f9f6f2; font-size: 0.7em; }
        .tile-super { background: #3c3a32; color: #f9f6f2; font-size: 0.6em; }

        /* ---- Game Over / Win overlay ---- */
        .game-message {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(238, 228, 218, 0.73);
            border-radius: 8px;
            z-index: 10;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 16px;
            animation: fadeIn 0.5s ease;
        }

        .game-message.show {
            display: flex;
        }

        @keyframes fadeIn {
            0% { opacity: 0; }
            100% { opacity: 1; }
        }

        .game-message .msg-text {
            font-size: 40px;
            font-weight: 900;
            color: #776e65;
        }

        .game-message .msg-sub {
            font-size: 16px;
            color: #776e65;
        }

        .game-message .btn-retry {
            background: #8f7a66;
            color: #f9f6f2;
            border: none;
            border-radius: 6px;
            padding: 12px 32px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.15s;
        }

        .game-message .btn-retry:hover {
            background: #9f8b77;
        }

        /* ---- Instructions ---- */
        .footer {
            margin-top: 16px;
            text-align: center;
            font-size: 13px;
            color: #776e65;
            opacity: 0.7;
            line-height: 1.6;
        }

        .footer kbd {
            background: #eee4da;
            padding: 2px 8px;
            border-radius: 4px;
            font-family: inherit;
            font-weight: 600;
        }

        /* ---- Responsive ---- */
        @media (max-width: 500px) {
            .container { padding: 12px; }
            .title { font-size: 36px; }
            .header { margin-bottom: 10px; }
            .board-wrapper { padding: 5px; }
            .board { gap: 5px; }
            .tile-container { top: 5px; left: 5px; right: 5px; bottom: 5px; }
            .controls label { font-size: 13px; }
            .game-message .msg-text { font-size: 28px; }
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Header -->
    <div class="header">
        <span class="title">2048</span>
        <div class="header-right">
            <div class="score-box">
                <div class="label">分数</div>
                <div class="value" id="score">0</div>
            </div>
            <button class="btn-new" id="btnNewGame">新游戏</button>
        </div>
    </div>

    <!-- Size Control -->
    <div class="controls">
        <label for="sizeSlider">棋盘大小</label>
        <input type="range" id="sizeSlider" min="3" max="10" value="4" step="1">
        <span class="size-value" id="sizeDisplay">4</span>
        <span style="font-size:13px;color:#776e65;opacity:0.7;">×</span>
        <span class="size-value" id="sizeDisplay2">4</span>
        <span class="difficulty-badge" id="difficultyBadge" style="margin-left:4px;padding:2px 10px;border-radius:12px;font-size:12px;font-weight:600;background:#eee4da;color:#776e65;"></span>
    </div>

    <!-- Board -->
    <div class="board-wrapper" id="boardWrapper">
        <div class="board" id="board"></div>
        <div class="tile-container" id="tileContainer"></div>
        <div class="game-message" id="gameMessage">
            <div class="msg-text" id="msgText"></div>
            <div class="msg-sub" id="msgSub"></div>
            <button class="btn-retry" id="btnRetry">再来一局</button>
        </div>
    </div>

    <div class="footer">
        使用 <kbd>←</kbd> <kbd>↑</kbd> <kbd>→</kbd> <kbd>↓</kbd> 或 <kbd>W</kbd> <kbd>A</kbd> <kbd>S</kbd> <kbd>D</kbd> 操作 · 支持触摸滑动
    </div>
</div>

<script>
(function () {
    'use strict';

    // ---- DOM refs ----
    const boardEl = document.getElementById('board');
    const tileContainer = document.getElementById('tileContainer');
    const scoreEl = document.getElementById('score');
    const sizeSlider = document.getElementById('sizeSlider');
    const sizeDisplay = document.getElementById('sizeDisplay');
    const sizeDisplay2 = document.getElementById('sizeDisplay2');
    const btnNewGame = document.getElementById('btnNewGame');
    const btnRetry = document.getElementById('btnRetry');
    const gameMessage = document.getElementById('gameMessage');
    const msgText = document.getElementById('msgText');
    const msgSub = document.getElementById('msgSub');

    // ---- State ----
    let size = 4;
    let grid = [];
    let score = 0;
    let gameOver = false;
    let gameWon = false;
    let keepPlaying = false;
    let isAnimating = false;

    // ---- Persistent tile elements ----
    // Each item: { id, element, row, col, value }
    let tileItems = [];
    let nextTileId = 0;

    const ANIM_DURATION = 150; // ms, matches CSS transition

    // ---- Initialize ----
    function init() {
        size = parseInt(sizeSlider.value, 10);
        sizeDisplay.textContent = size;
        sizeDisplay2.textContent = size;
        buildBoard();
        startGame();
    }

    // ---- Build grid background ----
    function buildBoard() {
        boardEl.style.gridTemplateColumns = `repeat(${size}, 1fr)`;
        boardEl.innerHTML = '';
        for (let i = 0; i < size * size; i++) {
            const cell = document.createElement('div');
            cell.className = 'cell';
            boardEl.appendChild(cell);
        }
    }

    // ---- Game logic ----
    function startGame() {
        grid = Array.from({ length: size }, () => Array(size).fill(0));
        score = 0;
        gameOver = false;
        gameWon = false;
        keepPlaying = false;
        isAnimating = false;
        gameMessage.classList.remove('show');
        updateScore();

        // Clear all persistent tile elements
        clearTileElements();

        // Add initial tiles proportional to board size
        const tpm = getTilesPerMove();
        const initialCount = Math.max(2, tpm * 2);
        for (let i = 0; i < initialCount; i++) {
            addRandomTile();
        }
        renderTiles();
        updateDifficultyBadge();
        console.log(`%c🔄 新游戏 (${size}×${size}) 初始${initialCount}个方块 每步+${tpm}`, 'font-size:16px;font-weight:bold;color:#e67e22;');
        logGrid('初始棋盘', grid);
    }

    function clearTileElements() {
        tileItems.forEach(t => t.element.remove());
        tileItems = [];
        nextTileId = 0;
    }

    function addRandomTile() {
        const empty = [];
        for (let r = 0; r < size; r++) {
            for (let c = 0; c < size; c++) {
                if (grid[r][c] === 0) empty.push([r, c]);
            }
        }
        if (empty.length === 0) return null;
        const [r, c] = empty[Math.floor(Math.random() * empty.length)];
        grid[r][c] = Math.random() < 0.9 ? 2 : 4;
        return { r, c, value: grid[r][c] };
    }

    // ---- Difficulty balance: more tiles per move on larger boards ----
    function getTilesPerMove() {
        // 4×4 (16 cells) → 1 tile per move, scale by area
        // Formula keeps 4×4 at 1 while larger boards generate more
        return Math.max(1, Math.floor(size * size / 18));
    }

    function updateDifficultyBadge() {
        const badge = document.getElementById('difficultyBadge');
        const tpm = getTilesPerMove();
        const cellsPerTile = size * size / tpm;
        let label, color, bg;
        if (size === 4 && tpm === 1)       { label = '经典'; color = '#776e65'; bg = '#eee4da'; }
        else if (cellsPerTile >= 30)       { label = '极难'; color = '#f9f6f2'; bg = '#f65e3b'; }
        else if (cellsPerTile >= 22)       { label = '困难'; color = '#f9f6f2'; bg = '#e67e22'; }
        else if (cellsPerTile >= 16)       { label = '适中'; color = '#f9f6f2'; bg = '#f2b179'; }
        else if (cellsPerTile >= 12)       { label = '较易'; color = '#776e65'; bg = '#ede0c8'; }
        else                               { label = '简单'; color = '#776e65'; bg = '#eee4da'; }
        badge.textContent = label + ' · +' + tpm;
        badge.style.background = bg;
        badge.style.color = color;
    }

    // ---- Debug logging ----
    function logGrid(label, g) {
        console.log(`%c${label}`, 'font-weight:bold;color:#e67e22;');
        const header = '   ' + Array.from({length: size}, (_,i) => `[${i}]`).join(' ');
        console.log(header);
        for (let r = 0; r < size; r++) {
            let row = `[${r}] `;
            for (let c = 0; c < size; c++) {
                const v = g[r][c];
                row += (v === 0 ? ' .' : String(v)).padStart(4);
            }
            console.log(row);
        }
    }

    function logMovements(movements) {
        for (const m of movements) {
            const parts = [`(${m.fromR},${m.fromC})→(${m.toR},${m.toC}) val=${m.value}`];
            if (m.merged) {
                parts.push(' MERGED');
                if (m.mergeFrom) {
                    for (const src of m.mergeFrom) {
                        parts.push(` mergeSrc=(${src.r},${src.c})`);
                    }
                }
            }
            console.log('  ' + parts.join(''));
        }
    }

    // ---- Move logic (return metadata for animation) ----
    function slideRowWithMeta(row) {
        // Collect non-zero values with their original column indices
        const nonZero = [];
        for (let i = 0; i < row.length; i++) {
            if (row[i] !== 0) nonZero.push({ value: row[i], index: i });
        }
        const result = [];
        const movements = []; // [{ fromIdx, toIdx, merged, mergeWith }]
        let outIdx = 0;
        let i = 0;
        let addedScore = 0;

        while (i < nonZero.length) {
            const cur = nonZero[i];
            if (i + 1 < nonZero.length && cur.value === nonZero[i + 1].value) {
                const val = cur.value * 2;
                result.push(val);
                movements.push({
                    fromIdx: cur.index,
                    toIdx: outIdx,
                    merged: true,
                    mergeWith: nonZero[i + 1].index,
                    value: val
                });
                addedScore += val;
                i += 2;
            } else {
                result.push(cur.value);
                movements.push({
                    fromIdx: cur.index,
                    toIdx: outIdx,
                    merged: false,
                    value: cur.value
                });
                i++;
            }
            outIdx++;
        }
        while (result.length < size) result.push(0);
        return { row: result, score: addedScore, movements };
    }

    function rotateGrid(g) {
        const n = g.length;
        const rotated = Array.from({ length: n }, () => Array(n).fill(0));
        for (let r = 0; r < n; r++) {
            for (let c = 0; c < n; c++) {
                rotated[c][n - 1 - r] = g[r][c];
            }
        }
        return rotated;
    }

    // Map rows of movements back to original grid coordinates
    function rowMovementsToGlobal(movements, rowIndex, rowBefore, direction) {
        // movements: [{ fromIdx, toIdx, merged, mergeWith, value }]
        // rowBefore: the original row values (before slide)
        // Returns: [{ fromR, fromC, toR, toC, value, merged, mergeFrom }]
        const result = [];
        for (const m of movements) {
            const fromC = m.fromIdx;
            const toC = m.toIdx;
            const value = m.value;
            if (direction === 'left') {
                const mergeFrom = m.merged ? [{ r: rowIndex, c: m.mergeWith }] : [];
                result.push({
                    fromR: rowIndex, fromC,
                    toR: rowIndex, toC,
                    value,
                    merged: m.merged,
                    mergeFrom
                });
            } else if (direction === 'right') {
                // For right, the "row" was reversed, so we need to map indices
                // fromIdx and toIdx are in the reversed coordinate space
                const origFromC = size - 1 - m.fromIdx;
                const origToC = size - 1 - m.toIdx;
                const mergeFrom = m.merged ? [{ r: rowIndex, c: size - 1 - m.mergeWith }] : [];
                result.push({
                    fromR: rowIndex, fromC: origFromC,
                    toR: rowIndex, toC: origToC,
                    value,
                    merged: m.merged,
                    mergeFrom
                });
            }
        }
        return result;
    }

    function moveLeft() {
        let moved = false;
        let totalScore = 0;
        const newGrid = [];
        const allMovements = [];

        for (let r = 0; r < size; r++) {
            const { row, score: s, movements } = slideRowWithMeta(grid[r]);
            newGrid.push(row);
            totalScore += s;
            if (row.join(',') !== grid[r].join(',')) moved = true;
            const globalMoves = rowMovementsToGlobal(movements, r, grid[r], 'left');
            allMovements.push(...globalMoves);
        }

        if (moved) {
            grid = newGrid;
            score += totalScore;
            updateScore();
            return allMovements;
        }
        return [];
    }

    function moveRight() {
        let moved = false;
        let totalScore = 0;
        const newGrid = [];
        const allMovements = [];

        for (let r = 0; r < size; r++) {
            const reversed = [...grid[r]].reverse();
            const { row, score: s, movements } = slideRowWithMeta(reversed);
            const finalRow = row.reverse();
            newGrid.push(finalRow);
            totalScore += s;
            if (finalRow.join(',') !== grid[r].join(',')) moved = true;
            const globalMoves = rowMovementsToGlobal(movements, r, grid[r], 'right');
            allMovements.push(...globalMoves);
        }

        if (moved) {
            grid = newGrid;
            score += totalScore;
            updateScore();
            return allMovements;
        }
        return [];
    }

    function moveUp() {
        // UP: counter-clockwise rotation + LEFT slide + clockwise rotation back
        // counter-clockwise: rotated[n-1-c][r] = grid[r][c]
        // This maps original column (top→bottom) → rotated row (left→right)
        // LEFT slide pushes values left → toward top of original column ✓
        const n = size;
        const rotated = Array.from({ length: n }, () => Array(n).fill(0));
        for (let r = 0; r < n; r++) {
            for (let c = 0; c < n; c++) {
                rotated[n - 1 - c][r] = grid[r][c];
            }
        }
        let moved = false;
        let totalScore = 0;
        const newRotated = [];
        const allMovements = [];

        for (let r = 0; r < size; r++) {
            const { row, score: s, movements } = slideRowWithMeta(rotated[r]);
            newRotated.push(row);
            totalScore += s;
            if (row.join(',') !== rotated[r].join(',')) moved = true;

            // Map rotated movements to original coordinates
            // rotated[r][c] = original[c][n-1-r] → original: (rotC, n-1-rotR)
            for (const m of movements) {
                const fromR = m.fromIdx;           // rotated col → original row
                const fromC = n - 1 - r;           // from rotated row → original col
                const toR = m.toIdx;
                const toC = n - 1 - r;
                const mergeFrom = m.merged ? [{ r: m.mergeWith, c: n - 1 - r }] : [];
                allMovements.push({
                    fromR, fromC,
                    toR, toC,
                    value: m.value,
                    merged: m.merged,
                    mergeFrom
                });
            }
        }

        if (moved) {
            // Clockwise rotation back: back[c][n-1-r] = newRotated[r][c]
            const back = Array.from({ length: n }, () => Array(n).fill(0));
            for (let r = 0; r < n; r++) {
                for (let c = 0; c < n; c++) {
                    back[c][n - 1 - r] = newRotated[r][c];
                }
            }
            grid = back;
            score += totalScore;
            updateScore();
            return allMovements;
        }
        return [];
    }

    function moveDown() {
        // DOWN: clockwise rotation + LEFT slide + counter-clockwise rotation back
        // clockwise: rotated[c][n-1-r] = grid[r][c]
        // This maps original column (bottom→top) → rotated row (left→right)
        // LEFT slide pushes values left → toward bottom of original column ✓
        const n = size;
        const rotated = rotateGrid(grid);
        let moved = false;
        let totalScore = 0;
        const newRotated = [];
        const allMovements = [];

        for (let r = 0; r < size; r++) {
            const { row, score: s, movements } = slideRowWithMeta(rotated[r]);
            newRotated.push(row);
            totalScore += s;
            if (row.join(',') !== rotated[r].join(',')) moved = true;

            // Map rotated movements to original coordinates
            // rotated[r][c] = original[n-1-c][r] → original: (n-1-rotC, rotR)
            for (const m of movements) {
                const fromR = n - 1 - m.fromIdx;
                const fromC = r;
                const toR = n - 1 - m.toIdx;
                const toC = r;
                const mergeFrom = m.merged ? [{ r: n - 1 - m.mergeWith, c: r }] : [];
                allMovements.push({
                    fromR, fromC,
                    toR, toC,
                    value: m.value,
                    merged: m.merged,
                    mergeFrom
                });
            }
        }

        if (moved) {
            // Counter-clockwise rotation back: back[n-1-c][r] = newRotated[r][c]
            const back = Array.from({ length: n }, () => Array(n).fill(0));
            for (let r = 0; r < n; r++) {
                for (let c = 0; c < n; c++) {
                    back[n - 1 - c][r] = newRotated[r][c];
                }
            }
            grid = back;
            score += totalScore;
            updateScore();
            return allMovements;
        }
        return [];
    }

    // ---- Input handler ----
    function handleMove(direction) {
        if (isAnimating) { console.log(`⚠️ 方向 ${direction} 被忽略（动画中）`); return; }
        if (gameMessage.classList.contains('show')) return;

        console.log(`%c▶ 按键：${direction}`, 'font-size:14px;font-weight:bold;color:#3498db;');
        logGrid('移动前棋盘', grid);

        let movements = [];
        switch (direction) {
            case 'left':  movements = moveLeft();  break;
            case 'right': movements = moveRight(); break;
            case 'up':    movements = moveUp();    break;
            case 'down':  movements = moveDown();  break;
        }

        if (movements.length > 0) {
            console.log(`%c移动产生 ${movements.length} 条动画指令:`, 'color:#27ae60;');
            logMovements(movements);
            logGrid('移动后棋盘(grid已更新)', grid);

            isAnimating = true;
            renderTilesAnimated(movements, () => {
                // Add new tiles based on board size to balance difficulty
                const tpm = getTilesPerMove();
                let addedCount = 0;
                for (let i = 0; i < tpm; i++) {
                    const newPos = addRandomTile();
                    if (newPos) {
                        addNewTileElement(newPos.r, newPos.c, newPos.value);
                        addedCount++;
                    }
                }
                if (addedCount > 0) {
                    console.log(`%c生成 ${addedCount} 个新方块`, 'color:#e74c3c;');
                    logGrid('生成方块后的棋盘', grid);
                }
                checkGameState();
                setTimeout(() => { isAnimating = false; }, 50);
            });
        } else {
            console.log(`%c✖ 方向 ${direction} 无有效移动`, 'color:#95a5a6;');
        }
    }

    // ---- Add a single new tile element (with appear animation) ----
    function addNewTileElement(r, c, val) {
        const { tileSize, gap } = calcTileSize();
        if (tileSize === 0) return;

        const tile = document.createElement('div');
        const cls = getTileClass(val);
        tile.className = `tile ${cls} new-tile`;
        tile.textContent = val;
        tile.style.width = tileSize + 'px';
        tile.style.height = tileSize + 'px';
        tile.style.left = (c * (tileSize + gap)) + 'px';
        tile.style.top = (r * (tileSize + gap)) + 'px';
        tile.style.fontSize = adjustFontSize(val, tileSize) + 'px';
        tileContainer.appendChild(tile);

        tileItems.push({
            id: nextTileId++,
            element: tile,
            row: r,
            col: c,
            value: val
        });

        setTimeout(() => tile.classList.remove('new-tile'), 250);
    }

    // ---- Animated rendering with movement metadata ----
    function renderTilesAnimated(movements, callback) {
        const { tileSize, gap } = calcTileSize();
        if (tileSize === 0) { callback(); return; }

        console.log('%c--- 动画阶段 ---', 'color:#9b59b6;font-weight:bold;');
        console.log('tileItems 状态:');
        for (const t of tileItems) {
            console.log(`  id=${t.id} (${t.row},${t.col}) val=${t.value}`);
        }

        // ----- Phase 1: Move existing tiles to their NEW positions -----
        // For each movement, find the corresponding tile element and update its position
        // The CSS transition will animate the slide.

        // Build a lookup: for each movement, which existing tile goes to the target?
        // Strategy: match by source position only (each position has at most one tile).
        // Value matching is NOT used because merge movements have post-merge value
        // which differs from the source tile's pre-merge value.
        const usedIds = new Set();
        const mergeSourceIds = new Set();  // tiles being merged OUT (will be removed from DOM)

        for (const move of movements) {
            const { fromR, fromC, toR, toC, value, merged, mergeFrom } = move;

            // Find the tile at the source position (each position has at most one tile)
            const srcTile = tileItems.find(t =>
                t.row === fromR && t.col === fromC &&
                !usedIds.has(t.id)
            );

            if (srcTile) {
                console.log(`  移动方块: id=${srcTile.id} (${fromR},${fromC})→(${toR},${toC}) 移动后值=${value} (原值=${srcTile.value})`);
                // Move this tile to the target position (CSS transition handles animation)
                srcTile.row = toR;
                srcTile.col = toC;
                srcTile.element.style.left = (toC * (tileSize + gap)) + 'px';
                srcTile.element.style.top = (toR * (tileSize + gap)) + 'px';
                usedIds.add(srcTile.id);
            } else {
                console.log(`  ⚠️ 找不到源位置(${fromR},${fromC})的tile! 运动→(${toR},${toC}) val=${value}`);
            }

            // For merged tiles, we need to animate the second source tile to the merge position too
            if (merged && mergeFrom.length > 0) {
                for (const src of mergeFrom) {
                    const mergeTile = tileItems.find(t =>
                        t.row === src.r && t.col === src.c &&
                        !usedIds.has(t.id)
                    );
                    if (mergeTile) {
                        console.log(`  合并方块: tile id=${mergeTile.id} (${src.r},${src.c})→(${toR},${toC})`);
                        mergeSourceIds.add(mergeTile.id);
                        // Slide this tile to the merge target position
                        mergeTile.element.style.left = (toC * (tileSize + gap)) + 'px';
                        mergeTile.element.style.top = (toR * (tileSize + gap)) + 'px';
                        usedIds.add(mergeTile.id);
                        // Remove it after the slide animation completes
                        setTimeout(() => {
                            mergeTile.element.remove();
                        }, ANIM_DURATION + 20);
                    } else {
                        console.log(`  ⚠️ 找不到合并源方块! mergeSrc=(${src.r},${src.c})`);
                    }
                }
            }
        }

        // Tiles not involved in any movement (didn't move) should still be rendered
        for (const t of tileItems) {
            if (!usedIds.has(t.id)) {
                // Position it explicitly (it may be a tile that didn't move this turn)
                t.element.style.left = (t.col * (tileSize + gap)) + 'px';
                t.element.style.top = (t.row * (tileSize + gap)) + 'px';
                usedIds.add(t.id);
            }
        }

        // After transitions complete, handle merges (value changes) and cleanup
        setTimeout(() => {
            // Now update values for merged tiles
            for (const move of movements) {
                if (move.merged) {
                    // Find the tile at the target position
                    const targetTile = tileItems.find(t =>
                        t.row === move.toR && t.col === move.toC &&
                        usedIds.has(t.id) && !mergeSourceIds.has(t.id)
                    );
                    if (targetTile) {
                        // Update its value
                        targetTile.value = move.value;
                        targetTile.element.textContent = move.value;
                        const cls = getTileClass(move.value);
                        targetTile.element.className = `tile ${cls} merged-tile`;
                        targetTile.element.style.fontSize = adjustFontSize(move.value, tileSize) + 'px';
                        setTimeout(() => {
                            targetTile.element.classList.remove('merged-tile');
                        }, 250);
                    }
                }
            }

            // Clean up: remove tile elements that are no longer on the board
            // After the move, check which tile items are still valid
            // Exclude merge source tiles (whose elements get removed separately)
            const validIds = new Set();
            let orphanCount = 0;
            for (let r = 0; r < size; r++) {
                for (let c = 0; c < size; c++) {
                    if (grid[r][c] !== 0) {
                        // Find the item that should be at this position (skip merge sources)
                        const item = tileItems.find(t =>
                            t.row === r && t.col === c &&
                            !mergeSourceIds.has(t.id)
                        );
                        if (item) validIds.add(item.id);
                        else console.log(`  ⚠️ 棋盘位置(${r},${c})=${grid[r][c]} 没有对应的tileItem!`);
                    }
                }
            }

            // Remove orphaned items
            const remaining = [];
            for (const t of tileItems) {
                if (validIds.has(t.id)) {
                    remaining.push(t);
                } else {
                    console.log(`  清理孤立方块: id=${t.id} (${t.row},${t.col}) val=${t.value}`);
                    orphanCount++;
                    t.element.remove();
                }
            }
            if (orphanCount > 0) console.log(`  共清理 ${orphanCount} 个孤立方块`);
            tileItems = remaining;
            console.log(`tileItems 剩余 ${tileItems.length} 个`);

            // Update all tile styles (colors, font sizes) to match current grid values
            for (let r = 0; r < size; r++) {
                for (let c = 0; c < size; c++) {
                    const val = grid[r][c];
                    if (val === 0) continue;
                    const item = tileItems.find(t => t.row === r && t.col === c);
                    if (item && item.value !== val) {
                        // Shouldn't happen at this point, but just in case
                        item.value = val;
                        item.element.textContent = val;
                        item.element.className = `tile ${getTileClass(val)}`;
                        item.element.style.fontSize = adjustFontSize(val, tileSize) + 'px';
                    }
                }
            }

            callback();
        }, ANIM_DURATION + 30);
    }

    // ---- Standard render (no animation, for init / reset) ----
    function renderTiles() {
        const { tileSize, gap } = calcTileSize();
        if (tileSize === 0) return;

        // Remove transition for instant positioning during reset
        const styleEl = document.createElement('style');
        styleEl.textContent = '.tile-no-transition { transition: none !important; }';
        document.head.appendChild(styleEl);

        tileContainer.innerHTML = '';
        tileItems = [];
        nextTileId = 0;

        for (let r = 0; r < size; r++) {
            for (let c = 0; c < size; c++) {
                const val = grid[r][c];
                if (val === 0) continue;

                const tile = document.createElement('div');
                const cls = getTileClass(val);
                tile.className = `tile ${cls} new-tile`;
                tile.textContent = val;
                tile.style.width = tileSize + 'px';
                tile.style.height = tileSize + 'px';
                tile.style.left = (c * (tileSize + gap)) + 'px';
                tile.style.top = (r * (tileSize + gap)) + 'px';
                tile.style.fontSize = adjustFontSize(val, tileSize) + 'px';
                tileContainer.appendChild(tile);

                tileItems.push({
                    id: nextTileId++,
                    element: tile,
                    row: r,
                    col: c,
                    value: val
                });
            }
        }

        // Remove the no-transition style after a frame
        requestAnimationFrame(() => {
            styleEl.remove();
        });

        // Remove new-tile class after the appear animation plays
        setTimeout(() => {
            document.querySelectorAll('.tile.new-tile').forEach(el => el.classList.remove('new-tile'));
        }, 300);
    }

    function calcTileSize() {
        const gap = 8;
        const containerWidth = tileContainer.clientWidth;
        if (containerWidth === 0) return { tileSize: 0, gap };
        const totalGaps = (size - 1) * gap;
        return { tileSize: (containerWidth - totalGaps) / size, gap };
    }

    // ---- Check win / lose ----
    function checkGameState() {
        if (!gameWon && !keepPlaying) {
            for (let r = 0; r < size; r++) {
                for (let c = 0; c < size; c++) {
                    if (grid[r][c] === 2048) {
                        gameWon = true;
                        showMessage('你赢了！🎉', '太厉害了！继续挑战更高分数吧', true);
                        return;
                    }
                }
            }
        }

        if (isGridFull() && !canMerge()) {
            gameOver = true;
            showMessage('游戏结束', `最终得分：${score}`, false);
        }
    }

    function isGridFull() {
        for (let r = 0; r < size; r++) {
            for (let c = 0; c < size; c++) {
                if (grid[r][c] === 0) return false;
            }
        }
        return true;
    }

    function canMerge() {
        for (let r = 0; r < size; r++) {
            for (let c = 0; c < size; c++) {
                const val = grid[r][c];
                if (c + 1 < size && grid[r][c + 1] === val) return true;
                if (r + 1 < size && grid[r + 1][c] === val) return true;
            }
        }
        return false;
    }

    function showMessage(text, sub, isWin) {
        msgText.textContent = text;
        msgSub.textContent = sub;
        gameMessage.classList.add('show');
    }

    function getTileClass(val) {
        if (val <= 2048) return 'tile-' + val;
        return 'tile-super';
    }

    function adjustFontSize(val, tileSize) {
        const base = tileSize * 0.42;
        if (val < 100) return base;
        if (val < 1000) return base * 0.85;
        if (val < 10000) return base * 0.7;
        if (val < 100000) return base * 0.55;
        return base * 0.45;
    }

    function updateScore() {
        scoreEl.textContent = score;
    }

    // ---- Size change ----
    sizeSlider.addEventListener('input', function () {
        size = parseInt(this.value, 10);
        sizeDisplay.textContent = size;
        sizeDisplay2.textContent = size;
        updateDifficultyBadge();
        buildBoard();
        startGame();
    });

    // ---- Buttons ----
    btnNewGame.addEventListener('click', startGame);
    btnRetry.addEventListener('click', startGame);

    // ---- Keyboard ----
    document.addEventListener('keydown', function (e) {
        const key = e.key;
        const directionMap = {
            'ArrowLeft': 'left',
            'ArrowRight': 'right',
            'ArrowUp': 'up',
            'ArrowDown': 'down',
            'a': 'left',
            'd': 'right',
            'w': 'up',
            's': 'down',
            'A': 'left',
            'D': 'right',
            'W': 'up',
            'S': 'down',
        };
        const dir = directionMap[key];
        if (dir) {
            e.preventDefault();
            console.log(`⌨️ 键盘按下: ${key} → 方向: ${dir}`);
            handleMove(dir);
        }
    });

    // ---- Touch (swipe) ----
    let touchStartX = 0;
    let touchStartY = 0;
    const wrapperBoard = document.getElementById('boardWrapper');

    wrapperBoard.addEventListener('touchstart', function (e) {
        const touch = e.touches[0];
        touchStartX = touch.clientX;
        touchStartY = touch.clientY;
    }, { passive: true });

    wrapperBoard.addEventListener('touchend', function (e) {
        const touch = e.changedTouches[0];
        const dx = touch.clientX - touchStartX;
        const dy = touch.clientY - touchStartY;
        const absDx = Math.abs(dx);
        const absDy = Math.abs(dy);
        const minSwipe = 30;

        if (Math.max(absDx, absDy) < minSwipe) return;

        if (absDx > absDy) {
            handleMove(dx > 0 ? 'right' : 'left');
        } else {
            handleMove(dy > 0 ? 'down' : 'up');
        }
    }, { passive: true });

    // ---- Keep playing after win ----
    gameMessage.addEventListener('click', function (e) {
        if (gameWon && !gameOver && !keepPlaying) {
            if (e.target === btnRetry) return;
            keepPlaying = true;
            gameMessage.classList.remove('show');
        }
    });

    // ---- Handle resize ----
    let resizeTimer;
    window.addEventListener('resize', function () {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(renderTiles, 150);
    });

    // ---- Start ----
    init();
})();
</script>
