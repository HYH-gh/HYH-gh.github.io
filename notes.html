<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>云便签</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/notes.css">
</head>
<body>
    <div class="app-bg"></div>

    <header class="header">
        <div class="header-left">
            <a class="logo-link" href="index.html" title="返回主页">
                <svg class="logo-icon" viewBox="0 0 32 32" width="28" height="28">
                    <rect x="2" y="2" width="12" height="12" rx="3" fill="var(--accent)"/>
                    <rect x="18" y="2" width="12" height="12" rx="3" fill="var(--accent)" opacity="0.6"/>
                    <rect x="2" y="18" width="12" height="12" rx="3" fill="var(--accent)" opacity="0.6"/>
                    <rect x="18" y="18" width="12" height="12" rx="3" fill="var(--accent)" opacity="0.35"/>
                </svg>
            </a>
            <span class="header-title">云便签</span>
        </div>
        <div class="header-right">
            <span class="admin-tag" id="userBadge" style="display:none"></span>
            <button class="header-btn" id="themeToggle" title="切换主题" onclick="toggleTheme()">
                <svg class="icon-sun" viewBox="0 0 24 24" width="18" height="18">
                    <circle cx="12" cy="12" r="5" fill="none" stroke="currentColor" stroke-width="2"/>
                    <line x1="12" y1="1" x2="12" y2="4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                    <line x1="12" y1="20" x2="12" y2="23" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                    <line x1="20" y1="12" x2="23" y2="12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                    <line x1="1" y1="12" x2="4" y2="12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                    <line x1="4.22" y1="4.22" x2="6.34" y2="6.34" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                    <line x1="17.66" y1="17.66" x2="19.78" y2="19.78" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                    <line x1="4.22" y1="19.78" x2="6.34" y2="17.62" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                    <line x1="19.78" y1="4.22" x2="17.62" y2="6.34" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                </svg>
                <svg class="icon-moon" viewBox="0 0 24 24" width="18" height="18">
                    <path d="M21 12.79A9 9 0 1 1 11.21 3a7 7 0 0 0 9.79 9.79z" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </button>
            <a class="header-btn" href="index.html">返回</a>
            <button class="header-btn" id="logoutBtn" style="display:none" onclick="logout()">退出</button>
        </div>
    </header>

    <main class="drive-container notes-container" id="notesContainer">
        <!-- 左栏：便签列表（类似云盘文件列表） -->
        <div class="drive-list-col">
            <div class="notes-tabs">
                <button class="notes-tab active" id="tabPublic" onclick="switchMode('public')">公开便签</button>
                <button class="notes-tab" id="tabPrivate" onclick="switchMode('private')">我的便签</button>
            </div>

            <!-- 公开便签（默认） -->
            <section id="publicPane">
                <div class="notes-toolbar">
                    <input type="text" id="publicSearch" class="notes-search" placeholder="输入便签名称查询…" onkeydown="if(event.key==='Enter')searchPublicNotes()">
                    <button class="btn btn-accent" onclick="searchPublicNotes()">查询</button>
                    <button class="btn btn-secondary" onclick="openPublicEdit()">创建</button>
                </div>
                <div class="notes-hint" id="publicHint">输入名称查询公开便签；公开便签创建后无法删除或修改，到期自动失效。</div>
                <div class="notes-list" id="publicList"></div>
            </section>

            <!-- 私密便签 -->
            <section id="privatePane" style="display:none">
                <div class="notes-toolbar">
                    <span class="notes-hint" id="privateHint">加载中…</span>
                    <button class="btn btn-accent" onclick="openNoteEdit(-1)">新建便签</button>
                </div>
                <div class="notes-list" id="privateList"></div>
            </section>
        </div>

        <!-- 右栏：查看 / 编辑预览面板（类似云盘预览） -->
        <aside class="preview-panel notes-panel" id="notesPanel">
            <!-- 空态 -->
            <div id="panelEmpty" class="notes-panel-empty">
                <div class="notes-panel-empty-icon">✎</div>
                <div>从左侧选择或创建便签</div>
            </div>

            <!-- 查看态 -->
            <div id="panelView" style="display:none" class="notes-panel-body">
                <div class="preview-panel-head">
                    <div class="preview-title" id="viewTitle">便签</div>
                    <div class="notes-panel-head-actions" id="viewHeadActions"></div>
                </div>
                <div class="notes-view-meta" id="viewMeta"></div>
                <div class="note-preview note-view-body" id="viewBody"></div>
            </div>

            <!-- 编辑态（私密便签） -->
            <div id="panelEdit" style="display:none" class="notes-panel-body">
                <div class="preview-panel-head">
                    <div class="preview-title" id="editTitle">编辑便签</div>
                    <div class="notes-panel-head-actions">
                        <button class="btn btn-secondary" onclick="closePanel()">关闭</button>
                    </div>
                </div>
                <div class="notes-edit-form">
                    <input type="text" id="noteTitle" class="notes-edit-title" maxlength="100" placeholder="便签标题">
                    <textarea id="noteContent" class="notes-edit-content" placeholder="# 标题&#10;**加粗** *斜体* `代码`&#10;- 列表项&#10;&gt; 引用" spellcheck="false"></textarea>
                    <div class="notes-edit-preview-label">预览</div>
                    <div class="note-preview notes-edit-preview" id="notePreview"></div>
                    <div class="auth-inline-msg" id="noteEditMsg" style="display:none"></div>
                    <div class="notes-edit-actions">
                        <button class="btn btn-accent" id="noteSaveBtn" onclick="saveNote()">保存</button>
                    </div>
                </div>
                <input type="hidden" id="noteEditId" value="">
            </div>

            <!-- 创建公开便签态 -->
            <div id="panelPublicEdit" style="display:none" class="notes-panel-body">
                <div class="preview-panel-head">
                    <div class="preview-title">创建公开便签</div>
                    <div class="notes-panel-head-actions">
                        <button class="btn btn-secondary" onclick="closePanel()">关闭</button>
                    </div>
                </div>
                <div class="auth-inline-msg" style="display:block;margin-bottom:12px">
                    公开便签创建后<strong>无法修改或删除</strong>，任何知道便签名称的人都可查询，请勿放入敏感信息。
                </div>
                <div class="notes-edit-form">
                    <input type="text" id="pubNoteName" class="notes-edit-title" maxlength="60" placeholder="便签名称（查询凭据，创建后不可改）">
                    <input type="text" id="pubNoteTitle" class="notes-edit-title" maxlength="100" placeholder="便签标题">
                    <textarea id="pubNoteContent" class="notes-edit-content" placeholder="# 标题&#10;**加粗** *斜体* `代码`" spellcheck="false"></textarea>
                    <div class="notes-edit-preview-label">保留时长（到期自动失效）</div>
                    <select id="pubExpiry" class="form-select">
                        <option value="1">1 小时</option>
                        <option value="6">6 小时</option>
                        <option value="24" selected>1 天</option>
                        <option value="72">3 天（最长）</option>
                        <option value="0">永不过期（仅登录用户）</option>
                    </select>
                    <div class="notes-edit-preview-label">预览</div>
                    <div class="note-preview notes-edit-preview" id="pubNotePreview"></div>
                    <div class="auth-inline-msg" id="pubEditMsg" style="display:none"></div>
                    <div class="notes-edit-actions">
                        <button class="btn btn-accent" id="pubSaveBtn" onclick="savePublicNote()">创建</button>
                    </div>
                </div>
            </div>
        </aside>
    </main>

    <!-- 通用确认对话框（替代浏览器 confirm） -->
    <div class="modal-overlay" id="noteDialog">
        <div class="modal modal-sm app-dialog">
            <div class="modal-title" id="noteDialogTitle">提示</div>
            <div class="app-dialog-body">
                <p class="app-dialog-msg" id="noteDialogMsg"></p>
            </div>
            <div class="modal-actions">
                <button class="btn btn-secondary" onclick="closeNoteDialog()">取消</button>
                <button class="btn btn-danger" id="noteDialogOk">确定</button>
            </div>
        </div>
    </div>

    <div id="toastContainer" class="toast-stack"></div>

    <script src="vendor/supabase.min.js"></script>
    <script src="js/notes.js"></script>
</body>
</html>
